unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g set-clipboard on

set -g base-index 1
set -g pane-base-index 1

set-option -g default-terminal "screen-256color"

set -g status-style bg=default
set -g status-left ""
set -g status-right "#[bg=#fbf1c7, fg=#665c64] #S "

set -g pane-border-style "fg=#d8c3a5"
set -g pane-active-border-style "fg=#d8c3a5"

set -g renumber-windows on

set -g window-status-current-format '#[bg=#fbf1c7, fg=#32302f] #I:#W #[defalut]'

set-option -g focus-events on

set -g escape-time 0
set -g mouse off
set -g repeat-time 1000
set -g history-limit 10000

# bindings
setw -g mode-keys vi

bind h split-window -v
bind v split-window -h

bind -n C-h select-pane -L
bind -n C-a select-pane -D
bind -n C-e select-pane -U
bind -n C-i select-pane -R

# USEFUL THINGS
# B + !  -> break current pane to new window
# B + $  -> Rename Session
# B + ,  -> Rename Window
# B + &  -> Kill window
# B + () -> change seeeion
# B + 1  -> goes to window 1
# B + d  -> detach
# B + E  -> spread evenly
# B + L  -> switch to last client
# B + [  -> Enter Copy Mode
# B + 1  -> goes to window 1
# B + =  -> Choose a paste buffer from a list
# B + ]  -> Paste the most recent paste buffer
# B + =  -> Choose a paste buffer from a list
# B + c  -> Create a new window
# B + d  -> Detach the current client
# B + f  -> Search for a pane
# B + q  -> Display pane numbers
# B + s  -> Choose a session from a list
# B + w  -> Choose a window from a list
# B + x  -> Kill the active pan
# B + z  -> Zoom the active pane
# B + {  -> Swap the active pane with the pane above
# B + }  -> Swap the active pane with the pane below
# B + t  -> Show a clock
